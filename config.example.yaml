# Example configuration for archive-relay. Copy to config.yaml and edit.
relay:
  addr: ":3334"           # websocket/http listen address
  serviceURL: ""          # canonical URL, used for NIP-42 AUTH (leave empty to disable)

clickhouse:
  addr: "localhost:9000"  # native protocol host:port
  database: "archive_relay"
  username: "default"
  password: ""

sqlite:
  path: "./control.db"    # embedded control plane (crawler/scheduler/auth state)

batch:
  maxSize: 10000          # flush a tier after this many buffered events
  maxAge: 5s              # ...or after this duration, whichever is first

policy:                  # REQ/COUNT breadth caps; 0 on a field = no limit
  maxIDs: 1000
  maxAuthors: 1000
  maxKinds: 20
  maxTags: 256
  # Inject `since` on the pure global-feed REQ shape only (0 disables).
  defaultSinceHours: 48

retention:                # per-tier TTL DELETE interval; empty = keep forever
  permanent: ""           # kinds 0,3,9735,10002
  archive: "10 YEAR"      # kind 1
  social: "1 YEAR"        # kinds 6,7,16

# Optional: override the built-in kind→tier classifier without recompiling.
# Keys are kind numbers; values are permanent|archive|social|drop.
# classifier:
#   5: permanent          # store NIP-09 deletion events as data
#   30023: archive        # long-form articles

crawler:
  priorityPubkeys: []          # pubkeys whose full in-scope history is fetched on schedule
  relays: []                   # relays used ONLY for the priority crawl (not -sources)
  interval: 10m                # priority crawl cadence

auth:
  enabled: false               # gate publish+read behind NIP-42 + the allow-list
  allowPubkeys: []             # static always-allowed keys (you, friends); read-only via NIP-86
  adminPubkeys: []             # may call the NIP-86 management RPC (allow/ban/list)
  # when enabled, relay.serviceURL MUST be set (it's part of the signed AUTH event).
  # paying customers are added to the SQLite allowed_pubkeys table via NIP-86
  # (or the freedompay purchase webhook).
