name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-unit:
    name: vet + build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  integration:
    name: integration tests (ClickHouse)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - '9000:9000'
          - '8123:8123'
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CH_ADDR: 'localhost:9000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      # store / stats / e2e are CH-backed and reliable.
      # internal/crawler is excluded: it hits the live relay.nostr.net.
      - run: go test -tags=integration -count=1 -timeout 120s ./internal/store/ ./internal/stats/ ./internal/e2e/
